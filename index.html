<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>重力のかたち</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#000;color:#f2ede4}
#gl{position:absolute;left:0;top:0;width:1920px;height:1080px}
.serif{font-family:"Yu Mincho","YuMincho","Noto Serif JP",serif}
#title{position:absolute;left:0;top:452px;width:1920px;text-align:center;opacity:0;text-shadow:0 0 30px rgba(0,0,0,.9),0 0 8px rgba(0,0,0,.8)}
#title b{display:block;font-size:84px;font-weight:500;padding-left:.45em}
#title span{display:block;margin-top:34px;font:400 21px "Yu Gothic UI","Segoe UI",sans-serif;letter-spacing:.62em;padding-left:.62em;color:#cfc8bb}
#credit{position:absolute;left:0;top:432px;width:1920px;text-align:center;opacity:0}
#credit b{display:block;font-size:44px;font-weight:500;letter-spacing:.3em;padding-left:.3em}
#credit p{margin:36px 0 0;font:400 23px/2 "Yu Gothic UI","Segoe UI",sans-serif;letter-spacing:.14em;color:#b9b2a6}
#credit small{display:block;margin-top:30px;font:400 17px "Cascadia Code",Consolas,monospace;letter-spacing:.12em;color:#7d776d}
#play{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);cursor:pointer;z-index:9}
#play div{font:600 28px "Yu Gothic UI",sans-serif;color:#f2ede4;padding:22px 44px;border:1px solid #f2ede4;border-radius:999px;background:#000}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="1920" height="1080"></canvas>
  <div id="title" class="serif"><b>重力のかたち</b><span>THE SHAPE OF GRAVITY</span></div>
  <div id="credit" class="serif">
    <b>重力のかたち</b>
    <p>この映像と音楽は、すべて数式とコードから生まれました。<br>カメラも、素材も、撮影もありません。</p>
    <small>geodesic ray tracing · 160,000-body simulation · procedural worlds · synthesized score — Claude Fable 5.2</small>
  </div>
</div>
<div id="play"><div>▶ クリックして再生</div></div>
<audio id="au" src="music.wav" preload="auto"></audio>
<script src="bundle.js"></script>
</body>
</html>
